version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: commit_explorer
      POSTGRES_USER: explorer
      POSTGRES_PASSWORD: supersecret
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer -d commit_explorer"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ./
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks: [appnet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz | grep -q 'OK'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [appnet]
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  appnet:
